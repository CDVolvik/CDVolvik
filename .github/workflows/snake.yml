name: contribution snake

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Render the contribution grid
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E94560&color_dots=#e9e9e9,#c4b5fd,#a78bfa,#8B5CF6,#6d28d9
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E94560&color_dots=#0a0a14,#3b2f63,#5b3f8f,#8B5CF6,#c4b5fd

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
